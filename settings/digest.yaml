knowledge_mode: digest
# output_template: compact | expanded
output_template: expanded
# gate_level: 0..3 (strictness)
gate_level: 1
auto_evolve: false
max_skill_md_bytes: 50000
retrieval:
  default_mode: keyword
  modes:
    keyword:
      enabled: true
    bm25:
      enabled: true
    semantic:
      enabled: false
    hybrid:
      enabled: true
      weights:
        keyword: 0.5
        bm25: 0.4
        evidence: 0.1
proposal:
  require_human_review: true
gates:
  citation_coverage_min: 0.8
  allow_tbd_usage: false
