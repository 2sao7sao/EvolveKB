name: Deploy Pages

# This workflow is intentionally set to manual-only until GitHub Pages is
# enabled for the repository. configure-pages@v5 returns 404 when the repo
# has no Pages site, which used to fail every push to main and surface as a
# "Last deployed: ..." entry in the repo UI even though no actual deployment
# happened. To re-enable automatic pushes:
#
#   1. Repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#   2. Re-add the `push` trigger block below.
#
# Until then, run this workflow manually from the Actions tab if you need to
# publish docs/index.html (after enabling Pages).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
