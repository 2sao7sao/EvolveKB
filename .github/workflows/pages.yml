name: Deploy Pages

# Deploys docs/index.html to GitHub Pages. Pages is enabled with GitHub Actions
# as the source, so pushes to main republish the site. The workflow stays
# manually runnable for a redeploy without a code change.
#
# History: configure-pages@v5 returned 404 while the repo had no Pages site, which
# is why pushes were disabled between June and November 2026.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
