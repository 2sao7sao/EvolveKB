name: Bug report
description: Report a reproducible EvolveKB problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a focused report. Please avoid private documents,
        credentials, customer traces, or sensitive proposal output.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke, and what did you expect instead?
      placeholder: "`python -m evolvekb.cli validate` fails on a valid SKILL.md procedure."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - knowledge assets
        - usage playbooks
        - skills
        - gates
        - evals
        - proposals / rollback
        - documentation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, minimal inputs, and relevant output.
      value: |
        ```bash
        python -m pytest -q
        python -m evolvekb.cli validate --settings settings/evolve.yaml
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste the smallest useful error or output excerpt.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EvolveKB version or commit
      placeholder: "0.3.0 or git SHA"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, install method, and shell.
      placeholder: "Python 3.11.9, macOS, pip install -e .[dev]"
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I removed private data, credentials, and customer traces.
          required: true
        - label: I included a minimal command or fixture when possible.
          required: true
