name: Feature request
description: Propose a product or engineering improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent knowledge workflow does this improve?
      placeholder: "Agents can retrieve policy text, but cannot route it through a governed playbook."
    validations:
      required: true
  - type: dropdown
    id: contribution_type
    attributes:
      label: Contribution type
      options:
        - demo
        - eval
        - skill
        - gate
        - proposal / rollback
        - integration
        - documentation
        - core runtime
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behavior and user-facing output.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the checks that would make this complete.
      value: |
        - [ ] The behavior is documented.
        - [ ] A deterministic test or eval covers the new behavior.
        - [ ] Existing validation gates still pass.
    validations:
      required: true
  - type: textarea
    id: prototype_scope
    attributes:
      label: Prototype or benchmark scope
      description: If this makes a capability claim, name the fixture, dataset, or benchmark.
      placeholder: "Seed-level eval only; no benchmark claim."
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: This request separates retrieval quality from governed knowledge-use behavior.
          required: true
        - label: This request does not require private credentials or customer data.
          required: true
